# Lego: deployment for Dokploy, the home server and CI.
#
# - No container_name and no host ports: Dokploy routes its domain to the
#   `web` service on port 80. For local access add compose.local.yml.
# - All configuration comes from environment variables (see .env.example).
# - Data lives only in named volumes.

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-lego}
      DB_USERNAME: ${DB_USERNAME:-lego}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      LEGO_MIGRATE_ON_START: ${LEGO_MIGRATE_ON_START:-true}
      LEGO_ADMIN_EMAIL: ${LEGO_ADMIN_EMAIL:-}
      LEGO_ADMIN_PASSWORD: ${LEGO_ADMIN_PASSWORD:-}
      LEGO_SESSION_IDLE_MINUTES: ${LEGO_SESSION_IDLE_MINUTES:-480}
      LEGO_SESSION_ABSOLUTE_DAYS: ${LEGO_SESSION_ABSOLUTE_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lego}
      POSTGRES_USER: ${DB_USERNAME:-lego}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - lego-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  lego-db:
